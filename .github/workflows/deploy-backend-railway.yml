name: Deploy Backend to Railway

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-railway.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Login Railway
        run: railway login --token "${{ secrets.RAILWAY_TOKEN }}"
      - name: Link project & environment
        run: |
          railway link --project "${{ secrets.RAILWAY_PROJECT_ID }}"
          if [ -n "${{ secrets.RAILWAY_ENV_ID }}" ]; then
            railway environment "$RAILWAY_ENV_ID"
          fi
      - name: Deploy backend service
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --yes
      - name: Healthcheck (optional)
        if: ${{ success() && secrets.BACKEND_HEALTH_URL != '' }}
        run: |
          sleep 20
          curl -fsS "${{ secrets.BACKEND_HEALTH_URL }}"
